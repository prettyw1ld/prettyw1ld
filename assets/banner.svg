.tw{animation:tw 2.6s ease-in-out infinite}
.d1{animation-delay:-.6s}.d2{animation-delay:-1.3s}.d3{animation-delay:-2s}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.role{opacity:0;animation:role 9s infinite}
.r2{animation-delay:3s}.r3{animation-delay:6s}
@keyframes role{0%{opacity:0;transform:translateY(6px)}5%,28%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.r1{opacity:1}}
</style>
